name: Publicar MathOs-Sky

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ejecutar pruebas
        run: node --test tests/*.test.js
      - name: Generar sitio estático
        run: node scripts/preparar-publicacion.js
      - name: Verificar archivos y rutas
        run: node scripts/verificar-publicacion.js
      - name: Subir solamente el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: publicacion
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
